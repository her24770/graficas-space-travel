# Producción: nginx sirve ./dist (lo sube GitHub Actions) y el servidor corre desde una imagen
# ya construida en CI (`docker load`). Nada se compila en este servidor.
# El nginx del host enruta: / → 3220 y /ws → 3221 (ver deploy/README.md).
services:
  web:
    image: nginx:alpine
    container_name: space_web
    ports:
      - "127.0.0.1:3220:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks: [space_net]

  server:
    image: space-server:latest
    container_name: space_server
    ports:
      - "127.0.0.1:3221:8000"
    restart: unless-stopped
    networks: [space_net]

networks:
  space_net:
    driver: bridge
