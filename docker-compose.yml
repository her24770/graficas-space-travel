# Simula producción en local: http://localhost:3220 (web + servidor multijugador)
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: space_web
    ports:
      - "127.0.0.1:3220:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: space_server
    ports:
      - "127.0.0.1:3221:8000"
    restart: unless-stopped
